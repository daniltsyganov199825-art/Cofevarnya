<style>
  :root{
    --bg:#f6efe6; --card:#fffaf3; --ink:#2b1d14; --muted:#8a7565; --line:#e7d9c8;
    --brown:#6b4226; --brown2:#8b5a36; --cream:#efe1cf; --accent:#c8763a;
    --ok:#3f7d4e; --warn:#d49a1f; --bad:#c2412d;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif}
  button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
  header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--brown);color:#fff6ea;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
  header .sub{font-size:12px;opacity:.75}
  header .sp{flex:1}
  .stat{font-size:12px;text-align:right;line-height:1.3;opacity:.9}
  .stat b{font-size:15px}
  .iconbtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);font-size:18px;color:#fff6ea}

  .tabs{display:none;gap:6px;padding:10px 12px 0}
  .tabs button{flex:1;padding:12px;border-radius:12px;background:var(--cream);font-weight:700;font-size:15px}
  .tabs button.on{background:var(--ink);color:#fff}
  .badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:20px;background:var(--accent);color:#fff;font-size:13px;margin-left:4px}

  main{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,1.15fr);gap:16px;padding:16px;align-items:start}
  section.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:4px 2px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
  h2 .grow{flex:1}

  .sizes{display:flex;gap:6px;margin-bottom:12px}
  .sizes button{flex:1;padding:10px 0;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:15px;background:#fff}
  .sizes button.on{border-color:var(--brown);background:var(--brown);color:#fff}
  .sizes .lbl{font-size:12px;color:var(--muted);align-self:center;padding-right:4px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-bottom:14px}
  .drink{min-height:64px;padding:10px 8px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:15px;line-height:1.15;transition:transform .08s, background .15s;position:relative}
  .drink.coffee{background:#f3e3d0;border-color:#e4cbb0}
  .drink.tea{background:#eef0df;border-color:#d9dcc0}
  .mods.syr button.on{background:var(--accent);border-color:var(--accent)}
  .drink:active{transform:scale(.95)}
  .drink.sel{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 0 0 3px var(--accent)}
  .pending{position:sticky;bottom:8px;z-index:3;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 14px;margin:6px 0 14px;box-shadow:0 8px 24px rgba(43,29,20,.25)}
  .pending.empty{background:var(--cream);color:var(--muted);box-shadow:none;position:static}
  .pending.empty .pcancel{display:none}
  .ptxt{flex:1;font-size:15px;line-height:1.3}
  .ptxt b{font-size:17px}
  .ptags{font-size:12px;color:#ffcf9c;font-weight:700}
  .pbtns{display:flex;gap:6px}
  .pcancel{width:44px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:800}
  .padd{padding:14px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;white-space:nowrap}
  .padd:disabled{opacity:.4}

  .mods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .mods button{padding:8px 12px;border-radius:30px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px}
  .mods button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .draft{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:60px}
  .draft.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .ditem{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .ditem:last-child{border-bottom:0}
  .ditem .nm{flex:1;font-weight:700}
  .ditem .tags{font-size:12px;color:var(--muted);font-weight:600}
  .chip{padding:6px 10px;border-radius:10px;background:var(--cream);font-weight:800;font-size:13px}
  .x{width:32px;height:32px;border-radius:10px;background:#f3e6e3;color:var(--bad);font-size:18px;font-weight:800}
  .who{width:100%;margin:10px 0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:600 15px -apple-system,Roboto,system-ui,sans-serif;background:#fff;color:var(--ink)}
  .who:focus{outline:2px solid var(--brown2)}
  .send{width:100%;padding:16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:17px}
  .send:disabled{opacity:.35}

  .queue{display:flex;flex-direction:column;gap:10px}
  .order{background:#fff;border:1.5px solid var(--line);border-left:8px solid var(--ok);border-radius:14px;padding:12px 12px 10px;animation:pop .25s ease}
  .order.warn{border-left-color:var(--warn)}
  .order.bad{border-left-color:var(--bad)}
  .order.first{box-shadow:0 0 0 3px var(--ink) inset, 0 6px 18px rgba(43,29,20,.12)}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .ohead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .num{font-size:26px;font-weight:800;line-height:1}
  .next{font-size:11px;font-weight:800;background:var(--ink);color:#fff;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
  .otime{font-size:13px;color:var(--muted);font-weight:600}
  .wait{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .order.warn .wait{color:var(--warn)} .order.bad .wait{color:var(--bad)}
  .owho{font-size:14px;font-weight:700;color:var(--brown2);margin-bottom:6px}
  .items{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--bg);text-align:left;width:100%;font-size:16px;font-weight:700}
  .it .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--brown2);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .it.done{opacity:.5;text-decoration:line-through}
  .it.done .box{background:var(--ok);border-color:var(--ok)}
  .it .sz{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none}
  .it .tg{font-size:12px;color:var(--accent);font-weight:700}
  .oact{display:flex;gap:8px}
  .give{flex:1;padding:13px;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;font-size:16px}
  .del{padding:13px 14px;border-radius:12px;background:#f3e6e3;color:var(--bad);font-weight:700}
  .emptyq{text-align:center;color:var(--muted);padding:40px 10px;font-weight:600}
  .emptyq div{font-size:40px;margin-bottom:6px}

  details.served{margin-top:14px}
  details.served summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 2px;font-size:14px}
  .srow{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .srow .s1{font-weight:800;width:40px}
  .srow .s2{flex:1;color:var(--muted)}
  .undo{font-size:13px;font-weight:700;color:var(--brown2);padding:6px 8px;border-radius:8px;background:var(--cream)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:20;display:flex;gap:12px;align-items:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast button{color:#ffcf9c;font-weight:800}

  .modal{position:fixed;inset:0;background:rgba(30,20,12,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal.show{display:flex}
  .mbox{background:var(--card);border-radius:18px;padding:18px;width:min(480px,100%);max-height:90vh;overflow:auto}
  .mbox h3{margin:0 0 6px}
  .mbox p{color:var(--muted);font-size:13px;margin:4px 0 10px}
  .mbox textarea{width:100%;min-height:140px;border-radius:12px;border:1.5px solid var(--line);padding:10px;font:600 14px -apple-system,Roboto,system-ui,sans-serif;background:#fff;color:var(--ink)}
  .mbox label{font-weight:800;font-size:13px;display:block;margin:12px 0 4px}
  .mrow{display:flex;gap:8px;margin-top:14px}
  .mrow button{flex:1;padding:13px;border-radius:12px;font-weight:800}
  .pri{background:var(--ink);color:#fff}
  .sec{background:var(--cream)}
  .danger{background:#f3e6e3;color:var(--bad)}

  @media (max-width:820px){
    main{grid-template-columns:1fr;padding:10px}
    .tabs{display:flex}
    body[data-tab="take"] #queuePanel{display:none}
    body[data-tab="queue"] #takePanel{display:none}
    .stat{display:none}
  }
</style>
</head>
<body data-tab="take">
<header>
  <div>
    <h1>☕ Кофеварня</h1>
    <div class="sub">очередь заказов</div>
  </div>
  <div class="sp"></div>
  <div class="stat">Выдано сегодня: <b id="stServed">0</b><br>Среднее ожидание: <b id="stAvg">—</b></div>
  <button class="iconbtn" id="btnSettings" title="Настройки">⚙</button>
</header>

<div class="tabs">
  <button id="tabTake" class="on">Принять заказ</button>
  <button id="tabQueue">Очередь <span class="badge" id="qBadge">0</span></button>
</div>

<main>
  <section class="panel" id="takePanel">
    <div class="sizes">
      <span class="lbl">Объём</span>
      <button data-size="250">250</button>
      <button data-size="350" class="on">350</button>
      <button data-size="450">450</button>
    </div>

    <h2>Кофе</h2>
    <div class="grid" id="gCoffee"></div>
    <h2>Не кофе</h2>
    <div class="grid" id="gOther"></div>
    <h2>Чаи</h2>
    <div class="grid" id="gTea"></div>

    <h2>Молоко и добавки</h2>
    <div class="mods" id="mods"></div>
    <h2>Сиропы</h2>
    <div class="mods syr" id="syrups"></div>

    <div class="pending empty" id="pending">
      <div class="ptxt" id="pendTxt"></div>
      <div class="pbtns">
        <button class="pcancel" id="cancelItem" title="Отменить выбор">×</button>
        <button class="padd" id="addItem" disabled>+ Добавить в заказ</button>
      </div>
    </div>

    <h2><span class="grow">Заказ гостя</span><button class="undo" id="clearDraft" style="display:none">очистить</button></h2>
    <div class="draft empty" id="draft">Нажми на напиток</div>
    <input class="who" id="who" placeholder="Имя или примета гостя (необязательно)" autocomplete="off">
    <button class="send" id="send" disabled>В очередь</button>
  </section>

  <section class="panel" id="queuePanel">
    <h2><span class="grow">Очередь · сначала самые ранние</span></h2>
    <div class="queue" id="queue"></div>
    <details class="served" id="servedBox">
      <summary>Выданные (<span id="servedCount">0</span>)</summary>
      <div id="served"></div>
    </details>
  </section>
</main>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Отменить</button></div>

<div class="modal" id="modal">
  <div class="mbox">
    <h3>Настройки</h3>
    <p>По одному напитку в строке. Изменения сохранятся на этом устройстве.</p>
    <label>Кофе</label>
    <textarea id="edCoffee"></textarea>
    <label>Не кофе</label>
    <textarea id="edOther"></textarea>
    <label>Чаи</label>
    <textarea id="edTeas"></textarea>
    <label>Добавки</label>
    <textarea id="edMods" style="min-height:90px"></textarea>
    <label>Сиропы</label>
    <textarea id="edSyrups"></textarea>
    <label>Подсветка ожидания (минуты): жёлтая / красная</label>
    <div style="display:flex;gap:8px">
      <input class="who" id="edWarn" type="number" min="1" style="margin:0">
      <input class="who" id="edBad" type="number" min="1" style="margin:0">
    </div>
    <div class="mrow">
      <button class="sec" id="mCancel">Отмена</button>
      <button class="pri" id="mSave">Сохранить</button>
    </div>
    <div class="mrow">
      <button class="danger" id="mReset">Новая смена: обнулить очередь и номера</button>
    </div>
  </div>
</div>

<script>
(function(){
  const KEY = 'kofevarnya-queue-v1';
  const MENU_V = 3;
  const DEFAULTS = {
    coffee: ['Эспрессо','Американо','Флэт уайт','Капучино','Латте','Раф','Бамбл'],
    other: ['Горячий шоколад','Какао','Матча латте'],
    teas: ['Чёрный (Ассам)','Зелёный (Сенча)','Альпийский луг','Облепиха–апельсин','Чёрная смородина','Маракуйя–грейпфрут','Малина–мята','Клюква–лимон'],
    mods: ['С собой','Кокосовое молоко','Миндальное молоко','Безлактозное молоко','Тёплое молоко','Лимон'],
    syrups: ['Карамель','Солёная карамель','Ваниль','Лесной орех','Миндаль','Банан','Мята','Лаванда'],
    warn: 4, bad: 7
  };
  let S = {
    menu: freshMenu(), menuV: MENU_V,
    warn: DEFAULTS.warn, bad: DEFAULTS.bad,
    day: today(), counter: 0, queue: [], served: []
  };
  let draft = [], pending = null, size = 350, activeMods = new Set(), lastAction = null;

  function freshMenu(){ return {coffee:[...DEFAULTS.coffee], other:[...DEFAULTS.other], teas:[...DEFAULTS.teas], mods:[...DEFAULTS.mods], syrups:[...DEFAULTS.syrups]}; }
  function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function load(){
    try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); S = Object.assign(S, o); } }catch(e){}
    if(S.menuV !== MENU_V){ S.menu = freshMenu(); S.menuV = MENU_V; }
    if(S.day !== today()){ S.day = today(); S.counter = 0; S.served = []; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hhmm = t => new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  function dur(ms){ const s=Math.max(0,Math.floor(ms/1000)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

  // ---------- Take order ----------
  function renderMenu(){
    const mk = (list, cls) => list.map(n => `<button class="drink ${cls} ${pending&&pending.name===n?'sel':''}" data-n="${esc(n)}">${esc(n)}</button>`).join('');
    $('gCoffee').innerHTML = mk(S.menu.coffee,'coffee');
    $('gOther').innerHTML = mk(S.menu.other,'');
    $('gTea').innerHTML = mk(S.menu.teas,'tea');
    const chip = (m, label) => `<button data-m="${esc(m)}" class="${activeMods.has(m)?'on':''}">${esc(label)}</button>`;
    $('mods').innerHTML = S.menu.mods.map(m => chip(m, m)).join('');
    $('syrups').innerHTML = S.menu.syrups.map(m => chip('сироп ' + m.toLowerCase(), m)).join('');
  }
  function renderPending(){
    const box = $('pending');
    $('send').disabled = !draft.length && !pending;
    if(!pending){
      box.className = 'pending empty';
      $('pendTxt').innerHTML = '1. Выбери напиток &nbsp;→&nbsp; 2. Объём и добавки &nbsp;→&nbsp; 3. Добавить';
      $('addItem').disabled = true; return;
    }
    box.className = 'pending';
    const mods = [...activeMods];
    $('pendTxt').innerHTML = `<b>${esc(pending.name)}</b> · ${size} мл${mods.length?`<div class="ptags">${mods.map(esc).join(' · ')}</div>`:'<div class="ptags">без добавок</div>'}`;
    $('addItem').disabled = false;
  }
  function commitPending(){
    if(!pending) return false;
    draft.push({name: pending.name, size, mods:[...activeMods]});
    pending = null; activeMods.clear();
    renderMenu(); renderPending(); renderDraft(); buzz(15);
    return true;
  }
  $('addItem').onclick = commitPending;
  $('cancelItem').onclick = () => { pending = null; activeMods.clear(); renderMenu(); renderPending(); };

  function renderDraft(){
    const d = $('draft');
    if(!draft.length){ d.className='draft empty'; d.innerHTML='Здесь появятся добавленные напитки'; }
    else{
      d.className='draft';
      d.innerHTML = draft.map((it,i)=>`
        <div class="ditem">
          <div class="nm">${esc(it.name)}${it.mods.length?`<div class="tags">${it.mods.map(esc).join(' · ')}</div>`:''}</div>
          <button class="chip" data-sz="${i}">${it.size}</button>
          <button class="x" data-rm="${i}">×</button>
        </div>`).join('');
    }
    $('send').disabled = !draft.length && !pending;
    $('send').textContent = draft.length ? `В очередь · ${draft.length} ${plural(draft.length,'напиток','напитка','напитков')}` : 'В очередь';
    $('clearDraft').style.display = draft.length ? '' : 'none';
  }
  function plural(n,a,b,c){ const m=n%10, h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<12||h>14)) return b; return c; }

  document.addEventListener('click', e => {
    const dr = e.target.closest('.drink');
    if(dr){
      pending = (pending && pending.name === dr.dataset.n) ? null : {name: dr.dataset.n};
      if(!pending) activeMods.clear();
      buzz(10); renderMenu(); renderPending(); return;
    }
    const md = e.target.closest('#mods button, #syrups button');
    if(md){ const m = md.dataset.m; activeMods.has(m)?activeMods.delete(m):activeMods.add(m); md.classList.toggle('on'); renderPending(); return; }
    const sz = e.target.closest('[data-sz]');
    if(sz){ const it = draft[+sz.dataset.sz]; it.size = it.size===250?350:it.size===350?450:250; renderDraft(); return; }
    const rm = e.target.closest('[data-rm]');
    if(rm){ draft.splice(+rm.dataset.rm,1); renderDraft(); return; }
    const sb = e.target.closest('.sizes button');
    if(sb){ size = +sb.dataset.size; document.querySelectorAll('.sizes button').forEach(b=>b.classList.toggle('on', b===sb)); renderPending(); return; }
  });
  $('clearDraft').onclick = () => { draft = []; renderDraft(); };

  $('send').onclick = () => {
    commitPending();
    if(!draft.length) return;
    S.counter += 1;
    const order = { id: Date.now()+Math.random(), num: S.counter, at: Date.now(), who: $('who').value.trim(),
      items: draft.map(d => ({...d, done:false})) };
    S.queue.push(order);
    draft = []; $('who').value = '';
    save(); renderDraft(); renderQueue();
    buzz([20,40,20]);
    toast(`Заказ №${order.num} в очереди`, null);
  };

  // ---------- Queue ----------
  function renderQueue(){
    const q = $('queue');
    $('qBadge').textContent = S.queue.length;
    if(!S.queue.length){ q.innerHTML = '<div class="emptyq"><div>☕</div>Очередь пустая</div>'; }
    else q.innerHTML = S.queue.map((o,idx) => `
      <div class="order ${idx===0?'first':''}" data-o="${o.id}">
        <div class="ohead">
          <span class="num">№${o.num}</span>
          ${idx===0?'<span class="next">СЛЕДУЮЩИЙ</span>':''}
          <span class="otime">принят в ${hhmm(o.at)}</span>
          <span class="wait" data-at="${o.at}">${dur(Date.now()-o.at)}</span>
        </div>
        ${o.who?`<div class="owho">${esc(o.who)}</div>`:''}
        <div class="items">
          ${o.items.map((it,i)=>`
            <button class="it ${it.done?'done':''}" data-tick="${o.id}|${i}">
              <span class="box">${it.done?'✓':''}</span>
              <span>${esc(it.name)}${it.mods.length?` <span class="tg">${it.mods.map(esc).join(' · ')}</span>`:''}</span>
              <span class="sz">${it.size} мл</span>
            </button>`).join('')}
        </div>
        <div class="oact">
          <button class="give" data-give="${o.id}">Выдан ✓</button>
          <button class="del" data-del="${o.id}">Удалить</button>
        </div>
      </div>`).join('');
    renderServed(); tick();
  }
  function renderServed(){
    $('servedCount').textContent = S.served.length;
    $('served').innerHTML = S.served.slice().reverse().slice(0,40).map(o => `
      <div class="srow">
        <span class="s1">№${o.num}</span>
        <span class="s2">${o.items.map(i=>esc(i.name)).join(', ')}${o.who?' — '+esc(o.who):''}<br>${hhmm(o.at)} → ${hhmm(o.doneAt)} · ждал ${dur(o.doneAt-o.at)}</span>
        <button class="undo" data-back="${o.id}">вернуть</button>
      </div>`).join('') || '<div class="srow"><span class="s2">Пока никого</span></div>';
    $('stServed').textContent = S.served.length;
    if(S.served.length){
      const avg = S.served.reduce((a,o)=>a+(o.doneAt-o.at),0)/S.served.length;
      $('stAvg').textContent = dur(avg);
    } else $('stAvg').textContent = '—';
  }
  function tick(){
    const now = Date.now();
    document.querySelectorAll('.wait').forEach(w => {
      const ms = now - (+w.dataset.at); w.textContent = dur(ms);
      const card = w.closest('.order'); const m = ms/60000;
      card.classList.toggle('bad', m >= S.bad);
      card.classList.toggle('warn', m >= S.warn && m < S.bad);
    });
  }
  setInterval(tick, 1000);

  const findQ = id => S.queue.findIndex(o => String(o.id)===id);
  $('queue').addEventListener('click', e => {
    const t = e.target.closest('[data-tick]');
    if(t){
      const [id,i] = t.dataset.tick.split('|'); const o = S.queue[findQ(id)];
      if(o){ o.items[+i].done = !o.items[+i].done; buzz(10); save(); renderQueue(); }
      return;
    }
    const g = e.target.closest('[data-give]');
    if(g){
      const k = findQ(g.dataset.give); if(k<0) return;
      const [o] = S.queue.splice(k,1); o.doneAt = Date.now(); S.served.push(o);
      lastAction = {type:'give', order:o, index:k};
      save(); renderQueue(); buzz(25); toast(`№${o.num} выдан`, true); return;
    }
    const d = e.target.closest('[data-del]');
    if(d){
      const k = findQ(d.dataset.del); if(k<0) return;
      const [o] = S.queue.splice(k,1);
      lastAction = {type:'del', order:o, index:k};
      save(); renderQueue(); toast(`№${o.num} удалён`, true); return;
    }
  });
  $('served').addEventListener('click', e => {
    const b = e.target.closest('[data-back]'); if(!b) return;
    const k = S.served.findIndex(o => String(o.id)===b.dataset.back); if(k<0) return;
    const [o] = S.served.splice(k,1); delete o.doneAt;
    insertByTime(o); save(); renderQueue();
  });
  function insertByTime(o){
    const k = S.queue.findIndex(x => x.at > o.at);
    k<0 ? S.queue.push(o) : S.queue.splice(k,0,o);
  }

  // ---------- Toast / undo ----------
  let tt;
  function toast(text, undo){
    $('toastText').textContent = text;
    $('toastUndo').style.display = undo ? '' : 'none';
    $('toast').classList.add('show');
    clearTimeout(tt); tt = setTimeout(()=>$('toast').classList.remove('show'), 3500);
  }
  $('toastUndo').onclick = () => {
    if(!lastAction) return;
    const {type, order} = lastAction;
    if(type==='give'){ const k = S.served.indexOf(order); if(k>=0) S.served.splice(k,1); delete order.doneAt; }
    insertByTime(order); lastAction = null;
    save(); renderQueue(); $('toast').classList.remove('show');
  };

  // ---------- Tabs ----------
  function setTab(t){ document.body.dataset.tab = t; $('tabTake').classList.toggle('on',t==='take'); $('tabQueue').classList.toggle('on',t==='queue'); }
  $('tabTake').onclick = () => setTab('take');
  $('tabQueue').onclick = () => setTab('queue');

  // ---------- Settings ----------
  $('btnSettings').onclick = () => {
    $('edCoffee').value = S.menu.coffee.join('\n');
    $('edOther').value = S.menu.other.join('\n');
    $('edMods').value = S.menu.mods.join('\n');
    $('edTeas').value = S.menu.teas.join('\n');
    $('edSyrups').value = S.menu.syrups.join('\n');
    $('edWarn').value = S.warn; $('edBad').value = S.bad;
    $('modal').classList.add('show');
  };
  $('mCancel').onclick = () => $('modal').classList.remove('show');
  const lines = v => v.split('\n').map(s=>s.trim()).filter(Boolean);
  $('mSave').onclick = () => {
    S.menu.coffee = lines($('edCoffee').value);
    S.menu.other = lines($('edOther').value);
    S.menu.mods = lines($('edMods').value);
    S.menu.teas = lines($('edTeas').value);
    S.menu.syrups = lines($('edSyrups').value);
    S.warn = Math.max(1, +$('edWarn').value || DEFAULTS.warn);
    S.bad = Math.max(S.warn+1, +$('edBad').value || DEFAULTS.bad);
    save(); renderMenu(); renderQueue(); $('modal').classList.remove('show');
  };
  let resetArmed = false;
  $('mReset').onclick = () => {
    if(!resetArmed){ resetArmed = true; $('mReset').textContent = 'Точно? Нажми ещё раз'; setTimeout(()=>{resetArmed=false;$('mReset').textContent='Новая смена: обнулить очередь и номера';},3000); return; }
    S.queue = []; S.served = []; S.counter = 0; S.day = today();
    save(); renderQueue(); $('modal').classList.remove('show');
    resetArmed = false; $('mReset').textContent='Новая смена: обнулить очередь и номера';
  };

  // keep screen awake where allowed
  async function wake(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
  document.addEventListener('click', wake, {once:true});
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') wake(); });

  load(); renderMenu(); renderPending(); renderDraft(); renderQueue();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
